# Updates docs/index.html (and friends) on a schedule (cron) and pushes back to main.
# GitHub Pages is configured to serve from the /docs folder of main.
#
# Manual run: Actions → "Update benchmark page" → Run workflow.
#
# If you need a SOCKS proxy for downloading (usually not needed here),
# add the SOCKS environment variable (e.g. secrets.SOCKS) and uncomment the env below.

name: Update benchmark page

on:
  schedule:
    # UTC, every 6 hours (00:00, 06:00, 12:00, 18:00). The change-detection
    # machinery keeps the tree byte-identical when nothing changed, so most of
    # these runs fetch and then commit nothing. Format: minute hour day month dow
    - cron: '0 */6 * * *'
  workflow_dispatch:   # manual run

permissions:
  contents: write   # so the updated files can be committed back to the repository

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Generate index.html
        env:
          PAGES: '1'
          SITE_URL: ${{ vars.SITE_URL }}   # https://USER.github.io/REPO — for SEO (OG/Twitter/JSON-LD)
          # SOCKS: ${{ secrets.SOCKS }}   # uncomment if a proxy is needed
        run: npm ci && npm start

      - name: Commit & push if changed
        run: |
          # Data diff = everything under docs/ EXCEPT the heartbeat, which is rewritten
          # every run by design (see docs/refresh.json) and must never count as "changed".
          DATA_CHANGED="$(git status --porcelain docs README.md | grep -v 'docs/refresh\.json' || true)"
          if [ -n "$DATA_CHANGED" ]; then
            git config user.name "opencode-benchmark bot"
            git config user.email "actions@users.noreply.github.com"
            git add docs README.md
            git commit -m "chore: refresh benchmark page ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            echo "docs updated"
          else
            echo "no data changes — only heartbeat (if any)"
          fi

          # Heartbeat is committed on its own even when no data changed, so the page can
          # show a truthful "checked N ago" and a stopped pipeline visibly goes stale.
          git add -f docs/refresh.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git config user.name "opencode-benchmark bot"
            git config user.email "actions@users.noreply.github.com"
            git commit -m "chore: heartbeat ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            echo "heartbeat updated"
          fi

          if [ -n "$(git log origin/main..HEAD)" ]; then
            git push
            echo "pushed"
          else
            echo "nothing to push — docs are up to date"
          fi
